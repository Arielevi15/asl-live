name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -q

      # TODO(#8): add the smoke training run here once src/asl/train.py,
      # configs/smoke.yaml and tests/fixtures/smoke/ exist:
      #   python -m asl.train --config configs/smoke.yaml
      # CI has no Kaggle access, so it must only ever read tests/fixtures/smoke/.
      # Issue #2 (CI green) is not closable until this step runs.

  javascript:
    name: JavaScript (parity tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # web/features.js is a pure ES module and the tests use the built-in
      # node:test runner, so there is nothing to install.
      - name: Node tests
        run: node --test "tests/**/*.test.js"

# Guard rails from CLAUDE.md. Revisions are pinned; bump them on purpose only.
# Install once with: pre-commit install
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        # 5 MB. Datasets and checkpoints live on Drive; only the small ONNX
        # model under web/model/ is allowed near this limit.
        args: ["--maxkb=5120"]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        # Notebook outputs are never committed.
        files: \.ipynb$
